# Free Supabase projects pause after about a week without activity.
# This pings the API once a day so the project stays awake.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY
# (GitHub: Settings > Secrets and variables > Actions).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "Missing secrets"; exit 1; }
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/roles?select=id&limit=1"
